services:
  laravel.test:
    build:
      context: './docker/8.5'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    container_name: "allsafe-web"
    image: 'sail-8.5/app'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      - pgsql
      - redis
      - minio
      - pgvector
  pgsql:
    image: 'postgres:18-alpine'
    ports:
      - '${FORWARD_DB_PORT:-5469}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE:-identity_db}'
      POSTGRES_USER: '${DB_USERNAME:-sail}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - 'sail-pgsql:/var/lib/postgresql'
      - './docker/pgsql/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/10-init-multiple-dbs.sh'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE:-identity_db}'
        - '-U'
        - '${DB_USERNAME:-sail}'
      retries: 3
      timeout: 5s
  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
  pgvector:
    image: 'pgvector/pgvector:pg18'
    container_name: "allsafe-pgvector"
    ports:
      - '${FORWARD_PGVECTOR_PORT:-5470}:5432'
    environment:
      POSTGRES_DB: 'knowledge_db'
      POSTGRES_USER: '${DB_USERNAME:-sail}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - 'sail-pgvector:/var/lib/postgresql'
    networks:
      - sail
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "knowledge_db", "-U", "sail" ]
      retries: 3
      timeout: 5s
  embedding:
    build:
      context: './docker/embedding'
      dockerfile: Dockerfile
    container_name: "allsafe-embedding"
    ports:
      - '${FORWARD_EMBEDDING_PORT:-8001}:8001'
    volumes:
      - 'sail-embedding-cache:/root/.cache/huggingface'
    environment:
      EMBEDDING_MODEL: 'sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2'
    networks:
      - sail
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  minio:
    image: 'minio/minio'
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: 'minioadmin'
      MINIO_ROOT_PASSWORD: 'minioadmin'
    volumes:
      - 'sail-minio:/data'
    command: server /data --console-address ":9001"
    networks:
      - sail
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 10
  createbuckets:
    image: 'minio/mc'
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - sail
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/documents;
      mc mb --ignore-existing local/generated;
      mc mb --ignore-existing local/reports;
      mc mb --ignore-existing local/templates;
      mc mb --ignore-existing local/temp;
      exit 0;
      "
  ollama:
    image: 'ollama/ollama:latest'
    container_name: "allsafe-ollama"
    profiles:
      - ai
    ports:
      - '${FORWARD_OLLAMA_PORT:-11434}:11434'
    volumes:
      - 'sail-ollama:/root/.ollama'
    networks:
      - sail
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 10
  llama:
    image: 'ghcr.io/ggml-org/llama.cpp:server'
    container_name: "allsafe-llama"
    profiles:
      - ai
    ports:
      - '${FORWARD_LLAMA_PORT:-8081}:8080'
    volumes:
      - 'sail-llama:/root/.cache/llama.cpp'
    networks:
      - sail
    command: >
      -hf Qwen/Qwen2.5-7B-Instruct-GGUF:
      --host 0.0.0.0
      --port 8080
      -c 16384
      -t 8
      -n 512
      --timeout 300
      -np 1
      --cont-batching
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 120s
networks:
  sail:
    driver: bridge
volumes:
  sail-pgsql:
    driver: local
  sail-redis:
    driver: local
  sail-minio:
    driver: local
  sail-ollama:
    driver: local
  sail-llama:
    driver: local
  sail-pgvector:
    driver: local
  sail-embedding-cache:
    driver: local
